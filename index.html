<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Estación Meteorológica</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <main>

    <header class="encabezado">

      <div>
        <h1>Estación Meteorológica</h1>

        <p>
          Monitoreo ambiental en tiempo real
        </p>
      </div>

      <div class="selector-periodo">

        <label for="periodo">
          Periodo
        </label>

        <select id="periodo">

          <option value="1">
            Última hora
          </option>

          <option value="6">
            Últimas 6 horas
          </option>

          <option value="24" selected>
            Últimas 24 horas
          </option>

        </select>

      </div>

    </header>


    <div id="estado">
      Cargando datos...
    </div>


    <section
      id="dashboard"
      class="dashboard"
    >
    </section>

  </main>


  <script src="script.js"></script>

</body>

</html>
